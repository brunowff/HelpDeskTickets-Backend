# Develop environment setup
spring:
    application:
        name: "Help Desk Tickets - Production"

# Develop database connections
    
    jpa:
        defer-datasource-initialization: true
        hibernate:
            ddl-auto: update
        properties:
            hibernate:
                formatSql: true
                jdbc:
                    lob:
                        non-contextual-creation: true
        show-sql: true
        databasePlatform: "org.hibernate.dialect.PostgreSQLDialect"
    sql:
        init:
            mode: always
    datasource:
        url: "jdbc:postgresql://localhost:5432/mydatabase"
        username: myuser
        password: secret

