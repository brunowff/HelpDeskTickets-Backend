# =============================================================================
# HelpDesk Tickets — Perfil: production
#
# Todas as variáveis sensíveis são injetadas via variáveis de ambiente.
# Em produção: configure as variáveis HDT_* no servidor ou no pipeline CI/CD.
# No GitHub Actions: os valores vêm dos GitHub Secrets (ver .github/workflows/ci.yml).
# =============================================================================
spring:
    application:
        name: "Help Desk Tickets - API"

    jpa:
        defer-datasource-initialization: true
        hibernate:
            ddl-auto: update
        properties:
            hibernate:
                formatSql: false
        show-sql: false
        databasePlatform: "org.hibernate.dialect.PostgreSQLDialect"
    sql:
        init:
            mode: always
    datasource:
        url: "jdbc:postgresql://${HDT_DATASOURCE_URL}"
        username: "${HDT_DATASOURCE_USERNAME}"
        password: "${HDT_DATASOURCE_PASSWORD}"

server:
    port: ${HDT_PORT:8080}
    error:
        include-stacktrace: never

springdoc:
    swagger-ui:
        enabled: false
    api-docs:
        enabled: false

jwt:
    public:
        key: "${HDT_API_RSA_PUBLIC_KEY}"
    private:
        key: "${HDT_API_RSA_PRIVATE_KEY}"
    token:
        ttl:
            access: ${HDT_API_TOKEN_ACCESS_TTL:300}
            refresh: ${HDT_API_TOKEN_REFRESH_TTL:3600}
