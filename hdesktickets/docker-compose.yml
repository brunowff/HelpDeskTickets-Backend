name: HelpDeskTickets
services:
  postgres_dev:
    image: 'postgres:latest'
    restart: always
    environment:
      - 'POSTGRES_DB=hdesktickets_db_dev'
      - 'POSTGRES_PASSWORD=secret'
      - 'POSTGRES_USER=hdesktickets'
      - 'POSTGRES_HOST_AUTH_METHOD: trust'
    ports:
      - '5433:5432'
  
  postgres_test:
    image: 'postgres:latest'
    restart: always
    environment:
      - 'POSTGRES_DB=hdesktickets_db_test'
      - 'POSTGRES_PASSWORD=secret'
      - 'POSTGRES_USER=hdesktickets'
      - 'POSTGRES_HOST_AUTH_METHOD: trust'
    ports:
      - '5434:5432'