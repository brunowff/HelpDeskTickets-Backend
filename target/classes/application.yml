# Production environment setup
spring:
    profiles:
        active: ${HDT_API_PROFILE:development}
    application:
        name: "Help Desk Tickets - Production"
server:
    servlet:
        context-path: '/hdesktickets'

springdoc:
    api-docs:
        path: /v3/api-docs
    swagger-ui:
        path: /swagger-ui.html
        disable-swagger-default-url: true
