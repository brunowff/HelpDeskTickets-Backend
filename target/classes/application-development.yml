# Develop environment setup
spring:
    application:
        name: "Help Desk Tickets - Development"
    #main:
        #allow-bean-definition-overriding: true

    # Develop database connections
    jpa:
        defer-datasource-initialization: true
        hibernate:
            ddl-auto: update
        properties:
            hibernate:
                formatSql: true
                jdbc:
                    lob:
                        non-contextual-creation: true
        show-sql: true
        databasePlatform: "org.hibernate.dialect.PostgreSQLDialect"
    sql:
        init:
            mode: always
    datasource:
        url: "jdbc:postgresql://localhost:5432/mydatabase"
        username: myuser
        password: secret

server:
    error:
        include-stacktrace: never

logging:
    level:
        org:
            springframework:
                security: 'DEBUG'

springdoc:
    swagger-ui:
        enabled: true
        #For sorting endpoints alphabetically
        operationsSorter: alpha
        #For sorting tags alphabetically
        tagsSorter: alpha
        
# keys
jwt:
    public:
        key: 'classpath:key/pub.key'
    private:
        key: 'classpath:key/app.key'
